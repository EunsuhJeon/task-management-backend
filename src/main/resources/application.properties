spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${DATABASE_USERNAME:taskuser}
spring.datasource.password=${DATABASE_PASSWORD:taskpass}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# JWT (override in production)
app.jwt.secret=${JWT_SECRET:task-management-dev-secret-key-must-be-at-least-256-bits-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Demo seed (admin@demo.com / member@demo.com, password: password123)
app.seed.enabled=${APP_SEED_ENABLED:false}
