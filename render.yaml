services:
  - type: web
    name: task-management-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_SEED_ENABLED
        value: "true"
      - key: JPA_DDL_AUTO
        value: update
      - key: JPA_SHOW_SQL
        value: "false"
      # Set DATABASE_URL / USERNAME / PASSWORD from your Render Postgres
